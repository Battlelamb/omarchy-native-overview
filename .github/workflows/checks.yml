name: Component checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Saved option validation
        run: node tests/settings.test.cjs
      - name: Saved preference store (offline sandbox)
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          # Namespace root cannot traverse the runner-owned private checkout.
          source=$(sudo mktemp -d /tmp/overview-store-ci.XXXXXX)
          trap 'sudo rm -rf -- "$source"' EXIT
          sudo cp -r runtime tests manifest.json "$source/"
          sudo bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp --ro-bind "$source" /work \
            --chdir /work --setenv HOME /tmp --setenv PATH /usr/bin \
            --setenv OVERVIEW_SANDBOX 1 --setenv PYTHONDONTWRITEBYTECODE 1 \
            /usr/bin/python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Window model
        run: node tests/model.test.cjs
      - name: Admission lifecycle
        run: node tests/lifecycle.test.cjs
      - name: Package layout and notices
        run: python3 scripts/check-package.py
